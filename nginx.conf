server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# SPA: unknown paths fall back to the app shell (client router takes over).
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Long-cache the fingerprinted asset bundle.
	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}
}
